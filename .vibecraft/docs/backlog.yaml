  - id: task-149
    title: Исправить 401 Unauthorized — добавить установку cookie на клиенте
    description: >-
      После входа в админ-панель при попытке сохранить настройки Т-банка
      возвращается ошибка 401 Unauthorized.


      Корень проблемы: серверный API (app/api/admin/login/route.ts)
      устанавливает httpOnly cookie admin_token с path=/. Но клиентский код в
      admin-login-form.tsx не использует эту cookie — он сохраняет токен только
      в localStorage через setToken().


      Когда браузер делает PUT /api/admin/payment-settings, httpOnly cookie
      admin_token отправляется автоматически (она установлена сервером). Но
      getTokenFromRequest() в lib/auth.ts читает cookie — и это должно работать.


      Проблема может быть в том, что httpOnly cookie не видна клиентскому JS, но
      она отправляется с запросами. Нужно:

      1. Проверить, что cookie admin_token действительно устанавливается после
      логина (через DevTools → Application → Cookies)

      2. Если cookie не устанавливается — добавить document.cookie = ... в
      admin-login-form.tsx после setToken()

      3. Пересобрать и перезапустить PM2
    status: completed
    acceptance_criteria:
      - После входа в админ-панель можно сохранять настройки Т-банка без ошибки
        401
      - getTokenFromRequest() находит токен в cookie admin_token
    summary: Добавлена установка `admin_token` в `document.cookie` в
      admin-login-form.tsx после успешного входа (строка 42) — дублирование
      токена из localStorage в cookie для случаев, когда httpOnly cookie от
      сервера не устанавливается (прокси/окружение). Также добавлена очистка
      cookie в clearToken() в admin-layout-client.tsx при выходе. Теперь
      getTokenFromRequest() гарантированно находит токен в cookie admin_token.
      typecheck, lint, build проходят без ошибок.
