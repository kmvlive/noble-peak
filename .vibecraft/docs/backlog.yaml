version: 1
tasks:
  - id: task-001
    title: Визуальная заглушка главной страницы
    description: >-
      Создать главную страницу приложения со статическими данными-заглушками.

      Цель: дать пользователю первый визуальный результат как можно быстрее.

      Реализовать только то, что пользователь увидит сразу при открытии
      приложения. Остальные страницы приложения реализовывать не нужно.
    status: completed
    acceptance_criteria:
      - Главная страница отображается без ошибок
      - В шапке отображается «magazin-tour. Магазин туров и активностей»
      - Показаны карточки-заглушки последних и популярных активностей
    summary: "Реализована главная страница со статическими данными-заглушками. В
      шапке отображается «magazin-tour. Магазин туров и активностей». На
      странице присутствует hero-секция с призывом, блок «Последние активности»
      (5 карточек) и блок «Популярные активности» (6 карточек). Данные
      активностей хранятся в lib/data.ts. Основная реализация: app/page.tsx,
      lib/data.ts, app/layout.tsx."
  - id: task-002
    title: Страница активности с фото, описанием, ценой и лайком
    description:
      "Создать отдельную страницу для каждой активности с уникальным URL.
      На странице: фотографии, название, описание (WYSIWYG), цена, кнопка лайка.
      Данные пока статические-заглушки."
    status: completed
    acceptance_criteria:
      - Каждая активность открывается по уникальному URL
      - На странице отображаются фото, название, описание, цена
      - Работает кнопка лайка
      - Описание отображается в форматированном виде
    summary: "Реализованы отдельные страницы для каждой активности по URL
      /activities/[id]. На странице: галерея фото (градиенты-заглушки с
      переключением), название, категория, короткое описание, полное описание
      (HTML с форматированием, отображается через dangerouslySetInnerHTML), цена
      и кнопка лайка (client-компонент с состоянием). Карточки на главной стали
      ссылками на страницы активностей. Все 10 активностей статически
      сгенерированы через generateStaticParams. Основная реализация:
      app/activities/[id]/page.tsx, components/activity-page-content.tsx,
      lib/data.ts."
  - id: task-003
    title: Разделы активностей
    description: Создать страницы разделов, куда администратор группирует
      активности. В разделе списком выводятся все активности этой категории.
      Данные пока статические.
    status: completed
    acceptance_criteria:
      - Разделы отображаются на главной и в меню
      - При переходе в раздел показываются все активности этой категории
    summary: "Созданы 7 разделов активностей (Водные, Треккинг, Гастрономия,
      Активный отдых, Экскурсии, Развлечения, Экстрим). Разделы отображаются на
      главной странице в виде карточек с иконками и количеством активностей, а
      также в навигационном меню в шапке сайта. Страница раздела
      (/sections/[slug]) показывает все активности выбранной категории в сетке.
      Данные — статические в lib/data.ts. Основная реализация:
      app/sections/[slug]/page.tsx, lib/data.ts, app/page.tsx, app/layout.tsx."
  - id: task-004
    title: "Админ-панель: вход и управление активностями"
    description:
      "Создать отдельную страницу входа для администратора по отдельному
      URL. После входа: CRUD для активностей (название, описание в
      WYSIWYG-редакторе, загрузка фотографий, цена, выбор раздела, ползунок
      «оплата / форма заказа»)."
    status: completed
    acceptance_criteria:
      - Админ-панель доступна по отдельному URL
      - Отдельная страница входа для администратора
      - Можно создавать, редактировать и удалять активности
      - Работает WYSIWYG-редактор описания
      - Можно загружать фотографии
      - Можно выбирать раздел для активности
      - Работает ползунок «оплата / форма заказа»
    summary:
      "Реализована админ-панель с отдельной страницей входа (/admin/login,
      проверка email/пароля, токен в localStorage). Дашборд (/admin) со списком
      активностей, поиском, созданием, редактированием и удалением. Форма
      создания/редактирования включает: WYSIWYG-редактор (TipTap), загрузку
      изображений (URL/градиенты), выбор раздела из существующих, ползунок
      «Оплата / Форма заказа», цену, лайки, популярность. API: POST
      /api/admin/login, GET/POST /api/admin/activities, GET/PUT/DELETE
      /api/admin/activities/[id]. Основная реализация: app/admin/,
      components/admin-*.tsx, lib/auth.ts, lib/models.ts (ActivityRecord),
      lib/schema.ts (таблица activities)."
  - id: task-005
    title: "Админ-панель: управление разделами и календарём"
    description:
      "Добавить в админ-панель: создание и удаление разделов, управление
      календарём доступных дат и часов для каждой активности."
    status: completed
    acceptance_criteria:
      - Можно создавать и удалять разделы
      - Можно отмечать доступные даты для активности
      - Можно отмечать доступные часы для даты (если не отмечены — доступен весь
        день)
    summary: "Реализовано управление разделами (создание/удаление) на странице
      /admin/sections через API /api/admin/sections, и управление календарём
      доступных дат/часов для каждой активности на странице редактирования
      активности (/admin/activities/[id]/edit) через API
      /api/admin/activities/[id]/calendar. Календарь отображает месячную сетку с
      возможностью отмечать доступные даты и выбирать часы (если часы не
      отмечены — доступен весь день). Основная реализация:
      components/admin-sections-manager.tsx,
      components/admin-activity-calendar.tsx,
      components/admin-activity-form.tsx, app/api/admin/sections/route.ts,
      app/api/admin/activities/[id]/calendar/route.ts, lib/models.ts,
      lib/schema.ts."
  - id: task-006
    title: "Личный кабинет клиента: регистрация и вход"
    description:
      "Создать отдельную страницу входа/регистрации клиента по отдельному
      URL. Регистрация: имя, телефон, email, пароль. Вход по email и паролю.
      После регистрации письмо с данными на email."
    status: completed
    acceptance_criteria:
      - Страница входа клиента доступна по отдельному URL
      - Регистрация с именем, телефоном, email и паролем
      - Вход по email и паролю
      - Письмо с регистрационными данными отправляется на email
    summary:
      "Реализована страница входа/регистрации клиента (/client/login) с двумя
      режимами: вход (email + пароль) и регистрация (имя, телефон, email,
      пароль). Добавлена таблица clients в DynamoDB, модель ClientRecord, API
      /api/client/register (с валидацией zod, хешированием пароля через crypto),
      API /api/client/login (с проверкой хеша). После регистрации отправляется
      письмо с данными через nodemailer (SMTP). Аутентификация через httpOnly
      cookie и токен."
  - id: task-007
    title: Календарь на странице активности и выбор даты/времени
    description:
      На странице активности отобразить календарь с доступными датами (из
      админ-панели). Если для даты отмечены часы — показать их для выбора. Если
      нет — доступен весь день.
    status: completed
    acceptance_criteria:
      - На странице активности отображается календарь
      - Показываются только доступные даты
      - Если есть часы — они отображаются для выбора
      - Если часов нет — доступен весь день
    summary:
      На странице активности (/activities/[id]) добавлен календарь с выбором
      даты и времени. Данные берутся из админ-панели через публичный API GET
      /api/activities/[id]/calendar. Компонент ActivityBookingCalendar
      отображает месяц с доступными датами (из админ-панели), при клике на дату
      с часами показывает выбор часов, при дате без часов — помечает «Весь
      день». Интеграция в ActivityPageContent. typecheck, lint, build проходят.
  - id: task-008
    title: Форма заказа и страница подтверждения
    description: "После выбора даты/времени: если активность настроена на форму
      заказа — показать форму с названием, датой, временем, именем, телефоном и
      полем «Мои подробности». Кнопка «Забронировать» отправляет письмо
      администратору. Если настроена на оплату — переход на страницу оплаты.
      После бронирования — страница подтверждения в личном кабинете."
    status: completed
    acceptance_criteria:
      - Форма заказа содержит все поля и кнопку «Забронировать»
      - Письмо с данными бронирования уходит на email администратора
      - При настройке «оплата» — переход на страницу оплаты
      - После бронирования открывается страница подтверждения в личном кабинете
    summary: "Реализована форма заказа на странице активности: при выборе
      даты/времени показываются поля (название, дата, время, имя, телефон, «Мои
      подробности») и кнопка «Забронировать». POST /api/bookings создаёт бронь в
      DynamoDB и отправляет письмо администратору. Если активность настроена на
      оплату — показывается ссылка на страницу /payment (заглушка). После
      бронирования открывается страница подтверждения /client/bookings/[id] со
      статусом, номером брони и кнопками навигации. Добавлен личный кабинет
      клиента с /client/bookings (список бронирований) и /api/client/me (данные
      клиента). Таблица bookings в DynamoDB, typecheck, lint, build проходят."
  - id: task-009
    title: "Админ-панель: управление email-ящиками и настройки"
    description: Создать страницу в админ-панели для управления email-ящиками
      уведомлений (добавление, удаление, выбор email по умолчанию) и другими
      настройками.
    status: completed
    acceptance_criteria:
      - Можно добавлять и удалять email-ящики
      - Можно выбрать email по умолчанию
      - Настройки сохраняются
    summary: "Создана страница /admin/settings в админ-панели для управления
      email-ящиками уведомлений. Реализовано: добавление/удаление email-ящиков,
      выбор email по умолчанию (звёздочка), сохранение настроек через API PUT
      /api/admin/settings. Добавлена таблица email_settings в DynamoDB, модель
      EmailSettingsRecord и CRUD-функции в lib/models.ts, мок-данные в
      lib/mock-data.ts. Пункт «Настройки» добавлен в боковое меню админ-панели.
      typecheck, lint, build проходят."
  - id: task-010
    title: Интеграция с платёжной системой Т-банка
    description:
      Реализовать страницу оплаты с интеграцией Т-банка. После успешной
      оплаты бронирование подтверждается. При ошибке — сообщение об ошибке.
    status: completed
    acceptance_criteria:
      - Страница оплаты интегрирована с Т-банком
      - После успешной оплаты бронирование подтверждается
      - При ошибке оплаты показывается сообщение
    summary:
      "Реализована интеграция с платёжной системой Т-банка (Tinkoff). Создан
      клиент T-Bank API (lib/payment.ts) с функциями Init, GetState,
      верификацией токена и проверкой статуса. API-маршруты: POST
      /api/payments/init (создание брони + инициация платежа), POST
      /api/payments/callback (вебхук от Т-банка для обновления статуса), GET
      /api/payments/status (проверка статуса). Страница /payment
      (components/payment-page-content.tsx) создаёт платёж и перенаправляет на
      страницу Т-банка. Страницы /payment/success и /payment/fail обрабатывают
      результат. В BookingRecord добавлены поля price, paymentId, paymentUrl,
      paymentStatus. Статус брони: pending_payment → confirmed после оплаты.
      Добавлены env-переменные TINKOFF_TERMINAL_KEY, TINKOFF_PASSWORD, BASE_URL.
      typecheck, lint, build проходят."
  - id: task-011
    title: Сменить логин и пароль администратора
    description: "Заменить учётные данные для входа в админ-панель: логин на
      artkmv1@ya.ru, пароль на Artkmv11."
    status: completed
    acceptance_criteria:
      - Вход в админ-панель работает с новым логином artkmv1@ya.ru и паролем
        Artkmv11
      - Старые учётные данные больше не работают
    summary:
      "Заменены учётные данные администратора: логин admin@magazin-tour.ru →
      artkmv1@ya.ru, пароль admin123 → Artkmv11. Изменения внесены в lib/auth.ts
      (fallback credentials), components/admin-login-form.tsx (placeholder) и
      lib/mock-data.ts (email-настройки по умолчанию). typecheck, lint, build
      проходят."
  - id: task-012
    title: "Админ-панель: страница настроек платёжной системы"
    description: "Добавить в админ-панель страницу для управления настройками
      интеграции с Т-банком: терминальный ключ (TerminalKey), пароль (Password),
      URL для вебхуков. Добавить пункт «Платёжная система» в боковое меню
      админ-панели."
    status: completed
    acceptance_criteria:
      - В боковом меню админ-панели есть пункт «Платёжная система»
      - "На странице отображаются поля: TerminalKey, Password, Webhook URL"
      - Можно сохранять и изменять настройки
      - Настройки сохраняются в базу данных
    summary:
      Создана страница /admin/payment-settings в админ-панели для управления
      настройками интеграции с Т-банком (TerminalKey, Password, Webhook URL). В
      боковое меню админ-панели добавлен пункт «Платёжная система» с иконкой
      CreditCard. Реализован API GET/PUT /api/admin/payment-settings с
      валидацией zod и проверкой авторизации. Настройки сохраняются в таблицу
      payment_settings в DynamoDB. Добавлены модели, schema, mock-данные.
      typecheck, lint, build проходят.
  - id: task-013
    title: Метка 18+ при создании активности и плашка на странице активности
    description:
      Добавить в форму создания/редактирования активности в админ-панели
      переключатель «18+». Если он включён, на странице активности для клиента
      перед показом содержимого появляется плашка с вопросом «Есть ли вам 18
      лет?» и кнопками Да/Нет. При выборе «Да» плашка скрывается и показывается
      содержимое. При выборе «Нет» — перенаправление на главную страницу.
    status: completed
    acceptance_criteria:
      - В админ-панели при создании/редактировании активности есть переключатель
        18+
      - На странице активности с меткой 18+ показывается плашка с вопросом о
        возрасте
      - При нажатии «Да» плашка скрывается и показывается содержимое
      - При нажатии «Нет» — перенаправление на главную страницу
      - Для активностей без метки 18+ плашка не показывается
    summary:
      Добавлен переключатель 18+ в форму создания/редактирования активности в
      админ-панели (components/admin-activity-form.tsx). Поле over18 добавлено в
      ActivityRecord (lib/models.ts), Activity (lib/data.ts), mock-данные
      (lib/mock-data.ts), схемы валидации API
      (app/api/admin/activities/route.ts,
      app/api/admin/activities/[id]/route.ts). При включённом флаге на странице
      активности отображается плашка AgeVerificationOverlay
      (components/age-verification-overlay.tsx) с вопросом «Есть ли вам 18 лет?»
      и кнопками Да/Нет — «Да» скрывает плашку, «Нет» перенаправляет на главную.
      Для активностей без метки 18+ плашка не показывается. typecheck, lint,
      build проходят.
  - id: task-014
    title: Удалить тестовые активности и разделы
    description: Удалить все тестовые/демо-активности и разделы из статических
      данных (lib/data.ts) и mock-данных (lib/mock-data.ts). Оставить только
      пустые массивы или минимальные заглушки, чтобы админ-панель и страницы
      работали без ошибок.
    status: completed
    acceptance_criteria:
      - Все тестовые активности удалены из статических данных
      - Все тестовые разделы удалены
      - Главная страница и страницы разделов не падают с ошибкой при пустых
        данных
      - Админ-панель показывает пустой список активностей
    summary:
      "Из статических данных (lib/data.ts) удалены все тестовые активности
      (10 штук: горный поход, морская прогулка, мастер-класс и др.) и все
      тестовые разделы (7 штук: Водные, Треккинг, Гастрономия и др.). Массивы
      activities и sections заменены на пустые. Интерфейсы Activity, Section и
      вспомогательные функции сохранены. Mock-данные (lib/mock-data.ts)
      автоматически стали пустыми через импорт из lib/data.ts. Главная страница,
      страницы разделов и админ-панель корректно работают с пустыми данными —
      показывают заглушки вместо контента. typecheck, lint, build проходят."
  - id: task-015
    title: Перезапустить dev-сервер для применения изменений
    description:
      Перезапустить контейнер с приложением, чтобы подхватились последние
      изменения в lib/auth.ts (новый логин и пароль администратора).
    status: completed
    acceptance_criteria:
      - Сервер перезапущен
      - Вход в админ-панель работает с логином artkmv1@ya.ru и паролем Artkmv11
    summary:
      Контейнер app перезапущен через docker compose up -d --force-recreate
      app. Сервер отвечает 200 на http://localhost:8080. npm run typecheck,
      lint, build проходят без ошибок. Учётные данные администратора
      (artkmv1@ya.ru / Artkmv11) активны после перезапуска.
  - id: task-016
    title: Исправить перенаправление после входа в админ-панель
    description: После успешного входа в админ-панель токен сохраняется в
      localStorage, но AdminLayoutClient не перепроверяет его при переходе на
      /admin. Нужно, чтобы компонент проверял наличие токена при каждом
      изменении пути, а не только при первом рендере.
    status: completed
    acceptance_criteria:
      - После входа с правильными данными пользователь перенаправляется на /admin
      - Админ-панель отображается, а не пустой экран
      - При отсутствии токена на /admin происходит редирект на /admin/login
    summary: Исправлено перенаправление после входа в админ-панель. В
      AdminLayoutClient (components/admin-layout-client.tsx) `isAuthed` теперь
      вычисляется как производное значение от `hasToken()` (localStorage) при
