version: 1
tasks:
  - title: Переключатель «Активности / Жильё» и страница-каталог «Снять что угодно»
    description: Добавить в шапку сайта переключатель между разделами «Активности» и
      «Жильё». Создать страницу-каталог «Снять что угодно», где показываются
      активные объявления по аренде жилья. На первом этапе страница отображает
      каркас каталога с пустым состоянием (нет активных объявлений) и
      информацией о скором появлении предложений.
    acceptance_criteria:
      - В шапке сайта есть переключатель «Активности / Жильё»
      - Переключатель открывает раздел «Снять что угодно»
      - Раздел «Снять что угодно» отображается без ошибок
      - Если в выбранном городе нет активных объявлений — показывается пустое
        состояние
    id: task-3530
    status: pending
    summary: null
  - title: "Сущность «Объявления»: типы жилья и хранение"
    description: "Создать отдельную сущность объявлений по аренде жилья (не
      смешивается с активностями): отдельная модель данных, хранение, API и
      раздел. При добавлении объявления партнёр выбирает один из четырёх типов:
      Номера/спальные места, Квартиры/апартаменты целиком, Дома/коттеджи
      целиком, Отдельные комнаты. Для каждого типа доступен свой набор подтипов
      (гостиница, отель, хостел, квартира, студия, коттедж, дом, комната в
      квартире и т.д.)."
    acceptance_criteria:
      - Создана отдельная сущность объявлений (не активности)
      - При создании объявления можно выбрать один из четырёх типов жилья
      - Для каждого типа доступны свои подтипы
      - Данные объявлений хранятся отдельно от активностей
    id: task-8631
    status: pending
    summary: null
  - title: "Кабинет партнёра: добавление объявления «Номера / спальные места»"
    description: "В кабинете партнёра добавить пункт «Добавить объявление». При
      выборе типа «Номера / спальные места» форма состоит из 4 шагов: Основная
      информация (подтип, название, описание, город, адрес), Фотографии, Номера
      (набор номеров с вместимостью и ценой), Питание (что входит). После
      заполнения объявление уходит на модерацию."
    acceptance_criteria:
      - В кабинете партнёра есть пункт «Добавить объявление»
      - Можно выбрать тип «Номера / спальные места»
      - "Форма состоит из 4 шагов: Основная информация, Фотографии, Номера,
        Питание"
      - Объявление сохраняется и уходит на модерацию
    id: task-7042
    status: pending
    summary: null
  - title: "Кабинет партнёра: добавление объявления «Квартиры / Дома / Комнаты
      целиком»"
    description: При выборе типов «Квартиры / апартаменты целиком», «Дома / коттеджи
      целиком» или «Отдельные комнаты» форма начинается с указания адреса и
      карты для точного определения места, затем Основная информация (подтип,
      название, описание, город), затем Фото и цена. После заполнения объявление
      уходит на модерацию.
    acceptance_criteria:
      - Можно выбрать типы «Квартиры», «Дома» или «Отдельные комнаты»
      - Форма начинается с адреса и карты для точного места
      - Затем идёт основная информация и поля фото и цены
      - Объявление сохраняется и уходит на модерацию
    id: task-9756
    status: pending
    summary: null
  - title: "Кабинет партнёра: «Мои объявления»"
    description: В кабинете партнёра добавить пункт «Мои объявления» со списком
      объявлений, добавленных партнёром, с указанием статуса (на модерации /
      одобрено / отклонено). Партнёр может открыть объявление, посмотреть данные
      и редактировать его.
    acceptance_criteria:
      - В кабинете партнёра есть пункт «Мои объявления»
      - Список показывает все объявления партнёра
      - У каждого объявления виден статус
      - Объявление можно открыть и редактировать
    id: task-9316
    status: pending
    summary: null
  - title: "Админ-панель: раздел «Новые услуги» для модерации объявлений"
    description: В админ-панели добавить раздел «Новые услуги», где отображаются
      объявления, добавленные партнёрами. Администратор может одобрить
      объявление (оно становится активным и появляется на сайте) или отклонить.
      Добавить пункт «Новые услуги» в боковое меню админ-панели.
    acceptance_criteria:
      - В админ-панели есть раздел «Новые услуги»
      - В разделе отображаются объявления от партнёров
      - Администратор может одобрить объявление — оно становится активным
      - Администратор может отклонить объявление
    id: task-4286
    status: pending
    summary: null
  - title: "Каталог «Снять что угодно»: отображение активных объявлений"
    description: На сайте в разделе «Снять что угодно» отображать активные
      объявления карточками с превью-фото, названием, типом жилья, городом,
      ценой и числом гостей. Карточка ведёт на отдельную страницу объявления с
      фотографиями, описанием, адресом на карте и ценой.
    acceptance_criteria:
      - В разделе «Снять что угодно» активные объявления показаны карточками
      - В карточке есть фото, название, тип жилья, город, цена
      - Карточка ведёт на отдельную страницу объявления
      - На странице объявления есть фото, описание, адрес на карте, цена
    id: task-1983
    status: pending
    summary: null
  - title: Раздел «Снять что угодно» появляется только при наличии активных
      объявлений в городе
    description: Раздел «Снять что угодно» (или соответствующая ссылка) показывается
      только когда в выбранном городе или месте есть хотя бы одно активное
      объявление. Если активных объявлений нет — раздел не отображается.
    acceptance_criteria:
      - Раздел «Снять что угодно» виден только если в городе есть активные
        объявления
      - Если активных объявлений в городе нет — раздел скрыт
      - Раздел связан с общим селектором города
    id: task-4008
    status: pending
    summary: null
  - title: Поиск и каталог жилья с фильтрами и ИИ-ассистентом
    description: "Реализовать отдельный поиск/каталог жилья с фильтрами: тип жилья,
      город, число гостей, даты заезда, цена. Поиск связан с общим селектором
      города. В каталоге есть ИИ-ассистент, который помогает уточнить запрос и
      предлагает подходящие объявления."
    acceptance_criteria:
      - Работает поиск по жилью с фильтрами по типу, городу, числу гостей, датам
        и цене
      - Поиск жилья связан с общим селектором города
      - В каталоге жилья есть ИИ-ассистент для уточнения запроса
      - Результаты отображаются карточками объявлений
    id: task-9134
    status: pending
    summary: null
