      проверяется, что ответ — массив. Если API возвращает объект с ошибкой, код
      пытается вызвать .map() на объекте, что приводит к ошибке «activities.map
      is not a function». Нужно добавить проверку Array.isArray() перед
      setActivities.
    status: completed
    acceptance_criteria:
      - Страница /admin/activities/pending не падает с ошибкой
      - При ошибке API показывается пустой список, а не краш
    summary: Добавлена проверка Array.isArray() в useEffect на странице
      /admin/activities/pending перед setActivities. Если API возвращает
      не-массив (например, объект с ошибкой), activities устанавливается в
      пустой массив [], что предотвращает краш страницы с ошибкой
      «activities.map is not a function». При ошибке API показывается пустой
      список «Нет новых активностей» вместо падения.
