  - id: task-7599
    title: Реальная двухсторонняя синхронизация с Bnovo (API v2)
    description: "Подключить первый менеджер каналов — Bnovo (открытый API v2,
      версия «Профессионал») — к календарю жилья. Партнёр подключает свой
      аккаунт Bnovo (вводит доступы из личного кабинета Bnovo Octopus → «API
      ключи» в настройках объявления), и система двухсторонне синхронизирует
      календарь. База: сервер https://api.pms.bnovo.ru, JWT-авторизация через
      POST /api/v1/auth (тело — ключи пользователя), далее заголовок
      Authorization: Bearer {token}; токен живёт ограниченно, при 401/истечении
      получать новый через /api/v1/auth. Синхронизация: 1) брони, созданные на
      нашем сайте, отправляются в Bnovo как занятые даты
      (создание/изменение/отмена брони через методы броней); 2) брони из Bnovo
      подтягиваются в наш календарь и блокируют даты как занятые; 3) свободные
      даты и цены из нашего календаря публикуются в Bnovo (цены тарифа); 4)
      закрытие дат владельцем уходит в Bnovo как закрытие продаж. Используемые
      методы API v2: авторизация (/api/v1/auth, /auth/token, /auth/me,
      /auth/logout), бронирования (GET /bookings с date_from/date_to, GET
      /bookings/{id}, PUT /bookings/{id}/status), комнаты (GET /rooms, GET
      /rooms/closed), наличие (GET /availability/rooms, GET
      /availability/roomtypes), тарифы/цены (GET /tariffs, GET
      /tariffs/prices/{planId}), типы комнат (GET /roomtypes), гости (POST/PUT
      /bookings/{id}/guests), вебхуки (POST/DELETE/GET /webhooks/subscribers,
      типы booking — CRUD брони и plans_data_update — изменение цен; подключение
      вебхуков занимает 24 часа, тестовые события отправляются сразу). Коды
      ответов: 200 успех, 401 ошибка авторизации, 404 не найдено, 406 ошибка
      валидации (список полей), 500 внутренняя ошибка. Лимиты запросов:
      /api/v1/auth и обновление ключа — не более 10 в минуту; остальные методы —
      30 за 10 сек, 300 за 5 мин, 1000 в час, 10000 в сутки; при превышении —
      429 Too Many Requests (повторный запрос через 1 минуту). Учитывать
      троттлинг/ретраи при 429 и редкое обновление токена. Синхронизация должна
      работать без двойных броней и без потери данных, с логированием ошибок."
    status: completed
    acceptance_criteria:
      - Партнёр может подключить свой аккаунт Bnovo (ввести доступы API из
        личного кабинета) в настройках объявления
      - "Авторизация через JWT: POST /api/v1/auth и заголовок Authorization:
        Bearer {token}, получение нового токена при 401/истечении"
      - Брони, созданные на нашем сайте, отправляются в Bnovo и отмечают даты
        как занятые
      - Брони из Bnovo подтягиваются в наш календарь и блокируют даты как занятые
      - Свободные даты и цены из нашего календаря публикуются в Bnovo (цены
        тарифа)
      - Закрытие дат владельцем уходит в Bnovo как закрытие продаж
      - Синхронизация выполняется без двойных броней и потери данных
      - Учтены лимиты запросов Bnovo (троттлинг/ретраи при 429) и коды ошибок
      - Используются методы и авторизация API v2 Bnovo (Bearer токен, /bookings,
        вебхуки booking и plans_data_update)
      - Реальная синхронизация проверена с тестовым (sandbox) ключом Bnovo
    summary: "Реализована реальная двухсторонняя синхронизация календаря жилья с
      Bnovo (API v2, версия «Профессионал»). Модуль lib/channels/bnovo: клиент
      (JWT-авторизация POST /api/v1/auth + Bearer, повторная авторизация при
      401, ретраи/бэк-офф при 429 и троттлинг через RateLimiter по лимитам
      канала), адаптер ChannelSyncAdapter и оркестрация sync.ts (импорт броней
      из /bookings -> блокировка дат, импорт закрытых дат /rooms/closed,
      публикация цен тарифа /tariffs/prices, закрытие продаж, отправка наших
      броней в канал). Вебхуки booking и plans_data_update через
      app/api/channels/bnovo/webhook, ручная синхронизация через /sync,
      подключение аккаунта через /connect (валидация доступов + регистрация
      вебхуков). В настройках объявления
      (components/listing-channels-manager.tsx) добавлены кнопки «Проверить» и
      «Синхронизировать». Исключение двойных броней через bookingMappings и
      external_id. Новая таблица LISTING_CHANNEL_SYNC (schema/models/migrate).
      typecheck, lint и build проходят. Критерий «проверено с sandbox-ключом» в
      данном окружении не мог быть выполнен (нет sandbox-ключей), поэтому код не
      тестировался против реального API."
