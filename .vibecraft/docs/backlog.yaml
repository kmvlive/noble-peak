    acceptance_criteria:
      - Можно выбрать типы «Квартиры», «Дома» или «Отдельные комнаты»
      - Форма начинается с адреса и карты для точного места
      - Затем идёт основная информация и поля фото и цены
      - Объявление сохраняется и уходит на модерацию
    summary: "Реализовано добавление объявлений для типов «Квартиры / апартаменты
      целиком», «Дома / коттеджи целиком» и «Отдельные комнаты». Создана форма
      (components/partner-home-listing-form.tsx), подключаемая из
      components/partner-listing-form.tsx, из 3 шагов: «Адрес и карта» (адрес +
      геокодирование через Nominatim и карта OSM с меткой), «Основная
