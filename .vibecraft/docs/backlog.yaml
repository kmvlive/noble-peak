    status: completed
    summary:
      "Исправлено сохранение HTML-разметки из WYSIWYG-редактора в активности.
      Корень проблемы: Editor.setOptions() в TipTap не обновляет
      ProseMirror-документ при изменении content — он сохраняет content в
      this.options, но не вызывает setContent. В WysiwygEditor добавлен
      useEffect, который синхронизирует value с редактором через
      editor.commands.setContent(). Теперь форматирование (жирный, заголовки,
      списки) сохраняется после редактирования, при повторном открытии редактора
      разметка отображается корректно, на странице активности описание
