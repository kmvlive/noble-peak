  - id: task-2617
    title: "Починить автодеплой: на сервере сборка падает, потому что скрипт деплоя
      выполняет npm install в окружении с NODE_ENV=production, и npm пропускает
      установку dev-зависимостей (из-за этого не установился @types/js-yaml и
      упал типчек). Нужно сделать, чтобы деплой всегда устанавливал
      dev-зависимости, необходимые для сборки (например, через npm install
      --include=dev)."
    description: "Починить автодеплой: на сервере сборка падает, потому что скрипт
      деплоя выполняет npm install в окружении с NODE_ENV=production, и npm
      пропускает установку dev-зависимостей (из-за этого не установился
      @types/js-yaml и упал типчек). Нужно сделать, чтобы деплой всегда
      устанавливал dev-зависимости, необходимые для сборки (например, через npm
      install --include=dev)."
    status: completed
    acceptance_criteria:
      - Запрос пользователя выполнен полностью
    meta:
      quick_implement_marker: quick_implement:call_43181c3f4e324d01b660af84
    summary: "Исправлен автодеплой: в скрипте app/api/deploy/route.ts команда npm
      install заменена на npm install --include=dev, чтобы при
      NODE_ENV=production dev-зависимости (например, @types/js-yaml) всегда
      устанавливались и типчек при сборке не падал."
