      соответствии с жёсткими правилами проекта «НИЧЕГО НИКОГДА НИКУДА НЕ
      ПРОПАДАЕТ»: загружаемые файлы (фото активностей, слайдера, аватарки
      партнёров в public/uploads/) должны авто-коммититься в git при каждом
      деплое и/или бэкапиться в отдельную папку backups/uploads/, которую деплой
      не удаляет и не перезатирает. Сейчас скрипт scripts/backup-uploads.ts
      существует, но автоматически не запускается — из-за этого при
      пересборке/доставке кода public/uploads перезаписывается состоянием из
