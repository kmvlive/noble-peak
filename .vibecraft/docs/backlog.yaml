      deploy (в .sourcecraft/ci.yaml) шаг, который перед/после доставки кода
      выполняет npm run upload:backup и git add+commit+push public/uploads,
      чтобы загруженные файлы коммитились и бэкапились автоматически; 2)
      убедиться, что backups/uploads исключён из того, что стирается при деплое
