    related_feature: Админ-панель
    status: completed
    summary: "Добавлено состояние isMounted (useState + useEffect) в
      AdminLayoutClient. На сервере и при первой гидратации рендерится спиннер,
      а не null, что устраняет расхождение между SSR и клиентским рендером.
      После монтирования компонент проверяет токен и отображает панель или
