    title: Исправить ошибку гидратации в AdminLayoutClient
    description:
      AdminLayoutClient — client-компонент, который на сервере не имеет
      доступа к localStorage и рендерит null, а на клиенте после гидратации
      видит токен и рендерит всю панель. Из-за этого возникает ошибка
      гидратации. Нужно добавить состояние isMounted, чтобы на сервере и при
      первой гидратации рендерить заглушку (спиннер/скелетон), а не null.
    status: completed
    acceptance_criteria:
      - Ошибка гидратации в консоли исчезла
      - Админ-панель работает как раньше
    summary: "Добавлено состояние isMounted (useState + useEffect) в
      AdminLayoutClient. На сервере и при первой гидратации рендерится спиннер,
      а не null, что устраняет расхождение между SSR и клиентским рендером.
      После монтирования компонент проверяет токен и отображает панель или
      перенаправляет на /admin/login. Основная реализация:
      components/admin-layout-client.tsx."
