version: 1
tasks:
  - id: task-3530
    title: Переключатель «Активности / Жильё» и страница-каталог «Снять что угодно»
    description: Добавить в шапку сайта переключатель между разделами «Активности» и
      «Жильё». Создать страницу-каталог «Снять что угодно», где показываются
      активные объявления по аренде жилья. На первом этапе страница отображает
      каркас каталога с пустым состоянием (нет активных объявлений) и
      информацией о скором появлении предложений.
    status: completed
    acceptance_criteria:
      - В шапке сайта есть переключатель «Активности / Жильё»
      - Переключатель открывает раздел «Снять что угодно»
      - Раздел «Снять что угодно» отображается без ошибок
      - Если в выбранном городе нет активных объявлений — показывается пустое
        состояние
    summary: Добавлен переключатель «Активности / Жильё» в шапку сайта
      (components/header-section-switch.tsx) и страница-каталог «Снять что
      угодно» по адресу /rent (app/rent/page.tsx, components/rent-catalog.tsx).
      Раздел отображает каркас каталога с пустым состоянием на основе выбранного
      города (localStorage), так как активных объявлений пока нет.
  - id: task-8631
    title: "Сущность «Объявления»: типы жилья и хранение"
    description: "Создать отдельную сущность объявлений по аренде жилья (не
      смешивается с активностями): отдельная модель данных, хранение, API и
      раздел. При добавлении объявления партнёр выбирает один из четырёх типов:
      Номера/спальные места, Квартиры/апартаменты целиком, Дома/коттеджи
      целиком, Отдельные комнаты. Для каждого типа доступен свой набор подтипов
      (гостиница, отель, хостел, квартира, студия, коттедж, дом, комната в
      квартире и т.д.)."
    status: completed
    acceptance_criteria:
      - Создана отдельная сущность объявлений (не активности)
      - При создании объявления можно выбрать один из четырёх типов жилья
      - Для каждого типа доступны свои подтипы
      - Данные объявлений хранятся отдельно от активностей
    summary: "Создана отдельная сущность объявлений по аренде жилья, не смешиваемая
      с активностями: таблица LISTINGS в DynamoDB
      (packages/shared/src/schema.ts), типы ListingRecord/HousingType и
      константы HOUSING_TYPES с четырьмя типами и их подтипами
      (packages/shared/src/models.ts), CRUD в lib/models.ts, REST API
      app/api/listings/route.ts с zod-валидацией и мок-фолбэком
      (lib/validation/listing.ts), mockListings. Добавлен раздел /listings
      (app/listings/page.tsx, components/listings-manager.tsx), где при создании
      объявления партнёр выбирает один из четырёх типов жилья и зависимый от
      него подтип; данные сохраняются в отдельной таблице listings."
  - id: task-7042
    title: "Кабинет партнёра: добавление объявления «Номера / спальные места»"
    description: "В кабинете партнёра добавить пункт «Добавить объявление». При
      выборе типа «Номера / спальные места» форма состоит из 4 шагов: Основная
      информация (подтип, название, описание, город, адрес), Фотографии, Номера
      (набор номеров с вместимостью и ценой), Питание (что входит). После
      заполнения объявление уходит на модерацию."
    status: completed
    acceptance_criteria:
      - В кабинете партнёра есть пункт «Добавить объявление»
      - Можно выбрать тип «Номера / спальные места»
      - "Форма состоит из 4 шагов: Основная информация, Фотографии, Номера,
        Питание"
      - Объявление сохраняется и уходит на модерацию
    summary: "В кабинет партнёра добавлен пункт меню «Добавить объявление»
      (/partner/listings/new, components/partner-listing-form.tsx). При выборе
      типа «Номера / спальные места» открывается форма из 4 шагов: Основная
      информация (подтип, название, описание, город, адрес), Фотографии (URL и
      загрузка с компьютера), Номера (набор номеров с вместимостью и ценой),
      Питание (что входит). Создан партнёрский API app/api/partner/listings с
      авторизацией и zod-валидацией (lib/validation/listing.ts); объявление
      сохраняется со статусом pending и уходит на модерацию. Модель
      ListingRecord расширена полями rooms и meals."
  - id: task-9756
    title: "Кабинет партнёра: добавление объявления «Квартиры / Дома / Комнаты
      целиком»"
    description: При выборе типов «Квартиры / апартаменты целиком», «Дома / коттеджи
      целиком» или «Отдельные комнаты» форма начинается с указания адреса и
      карты для точного определения места, затем Основная информация (подтип,
      название, описание, город), затем Фото и цена. После заполнения объявление
      уходит на модерацию.
