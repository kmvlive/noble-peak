  - id: task-180
    title: Исправить ошибку сборки _global-error
    description: "Исправить ошибку сборки _global-error: TypeError: Cannot read
      properties of null (reading 'useContext'). Проблема в том, что корневой
      layout содержит клиентские компоненты (RootProviders), которые используют
      usePathname/useRouter, а при prerender-е _global-error контекст
      next/navigation недоступен. Решение: вынести все клиентские компоненты из
      layout в динамический импорт с ssr:false, чтобы они не рендерились при
      статическом prerender-е."
    status: completed
    acceptance_criteria:
      - Production build успешно собирается без ошибки _global-error
      - Сервер запускается и отвечает на порту 8080
    summary: 'Создан компонент `components/root-client-components.tsx` с `"use
      client"`, который ре-экспортирует все клиентские компоненты
      (BridgeProvider, AnalyticsInjector, NotificationPoller, HeaderAuth,
      FooterMenu, InstallPrompt, Toaster) через `next/dynamic` с `{ ssr: false
      }`. Layout импортирует их из этого единого клиентского модуля, что
      предотвращает рендеринг при статическом prerender-е _global-error.
      Production build успешно собирается.'
