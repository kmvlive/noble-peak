  - id: task-156
    title: Исправить зависание при регистрации — сделать отправку email асинхронной
    description: >-
      В app/api/client/register/route.ts и app/api/partner/register/route.ts
      отправка email (sendEmail) выполняется синхронно перед ответом. Если SMTP
      не настроен или недоступен, запрос зависает на 30+ секунд и падает с
      ошибкой. При этом пользователь уже создан в БД.


      Нужно сделать отправку email асинхронной (fire-and-forget) — не ждать
      ответа от почты. Использовать .catch() для логирования ошибок, но не
      блокировать ответ клиенту.
    status: completed
    acceptance_criteria:
      - Регистрация клиента проходит без зависания — ответ приходит сразу
      - Письмо с данными отправляется асинхронно, не блокируя ответ
      - При ошибке отправки письма регистрация всё равно считается успешной
    summary: "Отправка email в app/api/client/register/route.ts и
      app/api/partner/register/route.ts переведена на fire-and-forget: await
      sendEmail заменён на sendEmail(...).catch(). Ответ клиенту возвращается
      сразу после создания пользователя в БД, письмо отправляется асинхронно.
      При ошибке SMTP регистрация считается успешной, ошибка логируется в
      консоль."
  - id: task-157
    title: Гостевая форма заказа с автоматической регистрацией по телефону
    description: >-
      Сейчас форма заказа требует авторизации клиента. Нужно сделать гостевой
      режим:

      1. Если пользователь не авторизован — показывать форму с полями: имя,
      телефон, подробности

      2. При отправке проверять телефон в БД клиентов

      3. Если телефон найден — сообщение «Этот номер уже используется.
      Пожалуйста, авторизуйтесь для оплаты»

      4. Если не найден — создавать клиента автоматически и оформлять бронь

      5. После оплаты предлагать установить пароль
    status: completed
    acceptance_criteria:
      - "Гостевая форма заказа работает без авторизации — поля: имя, телефон,
        подробности"
      - При отправке проверяется, есть ли телефон в БД клиентов
      - "Если телефон найден — показывается сообщение: «Этот номер уже
        используется. Пожалуйста, авторизуйтесь для оплаты»"
      - Если телефон не найден — клиент создаётся автоматически, бронь
        оформляется
      - После успешной оплаты новому клиенту предлагается установить пароль для
        личного кабинета
    summary:
      "Реализован гостевой режим в форме заказа и оплаты. Если пользователь
      не авторизован — форма бронирования содержит поля имя, телефон,
      подробности. При отправке через API /api/bookings проверяется телефон в БД
      клиентов (getClientByPhone). Если найден — возвращается 409 с сообщением
      «Этот номер уже используется. Пожалуйста, авторизуйтесь для оплаты». Если
      не найден — клиент создаётся автоматически (email:
      guest_{phone}@magazin-tour.ru). После успешной оплаты на страницах
      /client/bookings/[id] и /payment/success отображается компонент
      GuestSetPassword, предлагающий установить пароль для личного кабинета
      через API /api/client/set-password."
