      клиентов. При создании бронирования нужно обновлять календарь активности,
      убирая забронированные слоты. При загрузке календаря на странице
      активности нужно исключать уже забронированные даты/часы.
    status: completed
    acceptance_criteria:
      - После бронирования дата/часы скрываются из календаря для других клиентов
      - Если забронированы все часы в дате — дата становится недоступной
      - Если забронирован конкретный час — он не показывается, но другие часы в
        этой дате доступны
      - Администратор видит все бронирования в админ-панели
    summary: "Реализовано автоматическое скрытие забронированных дат/часов из
      календаря. Добавлена функция removeBookedSlotFromCalendar в lib/models.ts,
      которая удаляет забронированный слот из записи календаря активности. При
      бронировании через форму (POST /api/bookings) или оплату (POST
      /api/payments/init) вызывается эта функция: если указан конкретный час —
      он удаляется из списка, если удалены все часы или забронирован весь день —
      дата удаляется из календаря. Администратор по-прежнему видит и управляет
      всеми датами через админ-панель."
