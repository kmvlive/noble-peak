tokens:
  SERVICE_CONNECTION:
    service_connection: vibecraft-service-connection
    scope: org

workflows:
  deploy:
    tasks:
      - name: deploy-via-ssh
        cubes:
          - name: full-deploy
            script:
              - echo "=== SSH into production server and deploy ==="
              - ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 root@my.magazin-tour.ru "
                set -e
                echo '=== Connected to server ==='
                cd /opt/noble-peak

                echo '=== git pull ==='
                git pull origin main

                echo '=== Setting env vars ==='
                grep -q '^DEPLOY_SECRET=' .env.production 2>/dev/null || echo 'DEPLOY_SECRET=3724841febb66a37c1f25c9c8157a6521ccd9166c848e2371462a37f85f94852' >> .env.production
                grep -q '^RECEIVE_CODE_TOKEN=' .env.production 2>/dev/null || echo 'RECEIVE_CODE_TOKEN=src-ci-deploy-token-2026' >> .env.production

                echo '=== Rebuilding and restarting app ==='
                docker compose -f docker-compose.prod.yml build
                docker compose -f docker-compose.prod.yml up -d --force-recreate

                echo '=== DEPLOY COMPLETE ==='
                "
          - name: verify
            needs: [full-deploy]
            script:
              - echo "=== Verifying deployment ==="
              - sleep 15
              - curl -sf https://my.magazin-tour.ru/api/health > /dev/null && echo "HEALTH_OK" || echo "HEALTH_CHECK_FAILED"
              - curl -sf https://my.magazin-tour.ru/api/client/tourist-info > /dev/null && echo "TOURIST_INFO_OK" || echo "TOURIST_INFO_FAILED"
              - curl -sf https://my.magazin-tour.ru/api/admin/info > /dev/null && echo "ADMIN_INFO_OK" || echo "ADMIN_INFO_FAILED"
