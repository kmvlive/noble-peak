on:
  push:
    - workflows: deploy
      filter:
        branches: "main"

tokens:
  SERVICE_CONNECTION:
    service_connection: vibecraft-service-connection
    scope: org

workflows:
  deploy:
    tasks:
      - name: sync-from-github
        cubes:
          - name: sync
            script:
              - set -e
              - echo "=== Syncing latest code from GitHub kmvlive/noble-peak ==="
              - GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
              - GITHUB_URL="https://kmvlive:${GITHUB_TOKEN}@github.com/kmvlive/noble-peak.git"
              - echo "=== Configuring github remote ==="
              - git remote remove github 2>/dev/null || true
              - git remote add github "${GITHUB_URL}"
              - echo "=== Fetching and resetting to github/main ==="
              - git fetch github main
              - git reset --hard github/main
              - echo "=== SYNC FROM GITHUB COMPLETE ==="
      - name: push-code-to-github
        needs: [sync-from-github]
        cubes:
          - name: push
            script:
              - set -e
              - echo "=== Pushing SourceCraft code to GitHub kmvlive/noble-peak ==="
              - GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
              - GITHUB_URL="https://kmvlive:${GITHUB_TOKEN}@github.com/kmvlive/noble-peak.git"
              - echo "=== Unshallowing sourcecraft clone if needed ==="
              - git fetch --unshallow origin 2>/dev/null || true
              - echo "=== Auto-committing public/uploads so uploads are never lost ==="
              - git add public/uploads
              - git -c user.name="SourceCraft CI" -c user.email="ci@sourcecraft.local" commit -m "chore(auto-commit) public/uploads [ci skip]" 2>/dev/null || echo "No new uploads to commit"
              - echo "=== Configuring github remote ==="
              - git remote remove github 2>/dev/null || true
              - git remote add github "${GITHUB_URL}"
              - git push --force github HEAD:main
              - echo "=== PUSH TO GITHUB COMPLETE ==="
      - name: deliver-code
        needs: [push-code-to-github]
        cubes:
          - name: deliver
            script:
              - set -e
              - echo "=== Delivering code to production via deliver:code ==="
              - RECEIVE_CODE_TOKEN=${{ secrets.RECEIVE_CODE_TOKEN }}
              - export RECEIVE_CODE_TOKEN
              - npm install --include=dev
              - npm run deliver:code
              - echo "=== DELIVER CODE COMPLETE ==="
      - name: deploy-via-ssh
        needs: [push-code-to-github, deliver-code]
        cubes:
          - name: full-deploy
            script:
              - echo "=== SSH into production server and deploy ==="
              - |
                ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 root@my.magazin-tour.ru "
                set -e
                echo '=== Connected to server ==='
                cd /opt/noble-peak

                echo '=== git pull from GitHub ==='
                git pull origin main

                echo '=== Preserving backups/uploads (gitignored, untouched by deploy) ==='
                if [ -d backups/uploads ]; then echo 'backups/uploads preserved'; else echo 'no backups/uploads dir (nothing to preserve)'; fi

                echo '=== Rebuilding and restarting app ==='
                docker compose -f docker-compose.prod.yml build
                docker compose -f docker-compose.prod.yml up -d --force-recreate

                echo '=== Checking database (health + schema verify + migrations) ==='
                docker compose -f docker-compose.prod.yml exec -T app npm run db:check

                echo '=== DEPLOY COMPLETE ==='
                "
          - name: verify
            needs: [full-deploy]
            script:
              - echo "=== Verifying deployment ==="
              - sleep 15
              - curl -sf https://my.magazin-tour.ru/api/health > /dev/null && echo "HEALTH_OK" || echo "HEALTH_CHECK_FAILED"
              - curl -sf https://my.magazin-tour.ru/api/client/tourist-info > /dev/null && echo "TOURIST_INFO_OK" || echo "TOURIST_INFO_FAILED"
              - curl -sf https://my.magazin-tour.ru/api/admin/info > /dev/null && echo "ADMIN_INFO_OK" || echo "ADMIN_INFO_FAILED"
