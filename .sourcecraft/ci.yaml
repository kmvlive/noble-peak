tokens:
  SERVICE_CONNECTION:
    service_connection: vibecraft-service-connection
    scope: org

workflows:
  deploy:
    tasks:
      - name: write-env-and-deploy
        cubes:
          - name: setup-env
            script:
              - echo "=== Checking SSH access to production server ==="
              - ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 ubuntu@my.magazin-tour.ru "echo SSH_OK" || echo "SSH_FAILED"
              - echo "=== Trying to set DEPLOY_SECRET on server ==="
              - ssh -o StrictHostKeyChecking=no ubuntu@my.magazin-tour.ru "echo 'DEPLOY_SECRET=3724841febb66a37c1f25c9c8157a6521ccd9166c848e2371462a37f85f94852' | sudo tee -a /home/ubuntu/app/.env.production && echo 'RECEIVE_CODE_TOKEN=src-ci-deploy-token-2026' | sudo tee -a /home/ubuntu/app/.env.production && echo 'ENV_UPDATED'" || echo "ENV_UPDATE_FAILED"
              - echo "=== Restarting Docker container ==="
              - ssh -o StrictHostKeyChecking=no ubuntu@my.magazin-tour.ru "cd /home/ubuntu/app && docker compose -f docker-compose.prod.yml down && docker compose -f docker-compose.prod.yml up -d && echo 'RESTART_OK'" || echo "RESTART_FAILED"
              - echo "=== Deploy via webhook (alternative) ==="
              - echo "Will also try pushing to trigger webhook"
              - git push origin main 2>&1 || echo "PUSH_FAILED"
          - name: verify
            needs: [setup-env]
            script:
              - echo "=== Verifying deployment ==="
              - sleep 30
              - curl -sf https://my.magazin-tour.ru/api/health > /dev/null && echo "HEALTH_OK" || echo "HEALTH_CHECK_FAILED"
              - curl -sf https://my.magazin-tour.ru/api/client/tourist-info > /dev/null && echo "TOURIST_INFO_OK" || echo "TOURIST_INFO_FAILED"
              - curl -sf https://my.magazin-tour.ru/api/admin/info > /dev/null && echo "ADMIN_INFO_OK" || echo "ADMIN_INFO_FAILED"
